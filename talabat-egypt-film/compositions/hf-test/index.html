<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Placeholders: replace all three with the film's own palette and display face. */
      :root {
        --ground: #000;
        --ink: #ffffff;
        --font-display: sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
      }
      #title {
        color: var(--ink);
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <div id="orb" style="position:absolute;left:100px;top:480px;width:120px;height:120px;border-radius:50%;background:#FF5A00"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="3" data-track-index="0" style="position:absolute;top:200px">طلبات مصر · TEST</h1>
      <audio id="hit" src="assets/hit.wav" data-start="0.5" data-duration="1.2" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Example: tl.fromTo("#title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0);
      tl.to("#orb",{x:1500,duration:2.5,ease:"power3.inOut"},0.2); tl.fromTo("#title",{opacity:0,y:40},{opacity:1,y:0,duration:0.6},0.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
